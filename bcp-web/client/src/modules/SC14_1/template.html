<template id="SC14_1-template">

    <!-- <h1 class="mb-4">アカウント管理｜一覧</h1> -->

    <div class="row mb-4">

        <div class="col-xl">

            <div class="alert alert-warning alert-dismissible fade show" role="alert" data-bind="visible: ajaxing() === false && accounts().length === 0">
                該当データはありません。
            </div>
        
            <div class="row">
                <!-- ko foreach: {data:accounts, afterAdd: flashAnimation} -->
                <div class="col-lg-6 mb-3">
                    <div class="card shadow-sm">
                        <div class="card-body" data-bind="class: (downloadEnable === 'true')? 'bg-warning' : 'bg-white'">
                            <a href="#" class="float-end" data-bind="click:$parent.showSC14_3">
                                <svg style="vertical-align:-3px" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots-vertical" viewBox="0 0 16 16">
                                    <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                                </svg>
                            </a>

                            <h5 class="text-truncate" style="max-width:420px;margin-bottom: 0;">
                                <span data-bind="text: accountId" class="font-monospace"></span>
                                <abbr data-bind="attr:{title: accountName}"><strong data-bind="text: accountName"></strong></abbr>
                            </h5>
                            <h6 class="text-truncate mb-3" style="max-width:420px;color:#777;">
                                <abbr data-bind="attr:{title: accountAddress}"><span data-bind="text: accountAddress"></span></abbr>
                            </h6>

                            <div class="d-flex flex-row">
                                <div style="width:40%;aspect-ratio: 1;display: flex;justify-content: center;align-items: center;"
                                data-bind="class: (status === '1' || status === '2') ? 'bg-success' : (status === '0' ? 'bg-secondary' : 'bg-danger')">
                                    <div class="text-light" style="text-align: center;">
                                        <div data-bind="text:global.const.code.displayStatus[status]" style="font-size:2rem;"></div>
                                        <div data-bind="text:errorInfo" style="overflow-wrap: anywhere;"></div>
                                        <div data-bind="text:lastdate" class="font-monospace" style="font-size:0.8rem;"></div>
                                    </div>
                                </div>
                                <div class="ms-3 me-0 flex-fill">
                                    <span style="font-size:1.3rem" data-bind="text:Math.floor(usedSize/backupCapa * 100)"></span>%
                                    使用:
                                    <span style="font-size:1.0rem" data-bind="text:usedSize"></span>GB
                                    /
                                    <span style="font-size:1.3rem" data-bind="text:backupCapa"></span>GB

                                    <div class="progress" style="height: 5px">
                                        <div class="progress-bar bg-primary" data-bind="style:{width:(usedSize/backupCapa * 100) + '%'}"></div>
                                    </div>

                                    <div class="mt-3" style="font-size: 1rem">アップロード：
                                        <span data-bind="visible:uploadEnable === 'true'" class="text-primary">
                                            <svg style="vertical-align:-3px" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-toggle-on" viewBox="0 0 16 16">
                                                <path d="M5 3a5 5 0 0 0 0 10h6a5 5 0 0 0 0-10zm6 9a4 4 0 1 1 0-8 4 4 0 0 1 0 8"/>
                                            </svg>
                                        </span>
                                        <span data-bind="visible:uploadEnable !== 'true'" class="text-muted">
                                            <svg style="vertical-align:-3px" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-toggle-off" viewBox="0 0 16 16">
                                                <path d="M11 4a4 4 0 0 1 0 8H8a5 5 0 0 0 2-4 5 5 0 0 0-2-4zm-6 8a4 4 0 1 1 0-8 4 4 0 0 1 0 8M0 8a5 5 0 0 0 5 5h6a5 5 0 0 0 0-10H5a5 5 0 0 0-5 5"/>
                                            </svg>
                                        </span>
                                        <!-- <strong data-bind="text:uploadEnable === 'true' ? 'ON' : 'OFF'">ON</strong>  -->
                                        <span data-bind="visible:uploadEnable === 'true'">
                                            <svg style="vertical-align:-3px" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-repeat" viewBox="0 0 16 16">
                                                <path d="M11 5.466V4H5a4 4 0 0 0-3.584 5.777.5.5 0 1 1-.896.446A5 5 0 0 1 5 3h6V1.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384l-2.36 1.966a.25.25 0 0 1-.41-.192m3.81.086a.5.5 0 0 1 .67.225A5 5 0 0 1 11 13H5v1.466a.25.25 0 0 1-.41.192l-2.36-1.966a.25.25 0 0 1 0-.384l2.36-1.966a.25.25 0 0 1 .41.192V12h6a4 4 0 0 0 3.585-5.777.5.5 0 0 1 .225-.67Z"/>
                                            </svg>                                            
                                            <strong data-bind=" text: uploadTiming"></strong><small>分</small>
                                        </span>
                                    </div>
                                    <div style="font-size: 1rem">ダウンロード：
                                        <span data-bind="visible:downloadEnable === 'true'" class="text-primary">
                                            <svg style="vertical-align:-3px" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-toggle-on" viewBox="0 0 16 16">
                                                <path d="M5 3a5 5 0 0 0 0 10h6a5 5 0 0 0 0-10zm6 9a4 4 0 1 1 0-8 4 4 0 0 1 0 8"/>
                                            </svg>
                                        </span>
                                        <span data-bind="visible:downloadEnable !== 'true'" class="text-muted">
                                            <svg style="vertical-align:-3px" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-toggle-off" viewBox="0 0 16 16">
                                                <path d="M11 4a4 4 0 0 1 0 8H8a5 5 0 0 0 2-4 5 5 0 0 0-2-4zm-6 8a4 4 0 1 1 0-8 4 4 0 0 1 0 8M0 8a5 5 0 0 0 5 5h6a5 5 0 0 0 0-10H5a5 5 0 0 0-5 5"/>
                                            </svg>
                                        </span>
                                    </div>
                                    <div class="mt-3">端末ソフトウェア：ver.<span data-bind="text:softVersion"></span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /ko -->
            </div>

            <button class="btn btn-secondary bg-gradient"
                data-bind="visible: hasContinueData, click: fetchMore">続きを表示</button>

            <hr class="d-block d-xl-none my-3">

        </div>


        <div class="col-xl-auto" style="width: 15rem;">

            <h5 class="mb-3">
                <b>検索条件</b>
            </h5>

            <div class="mb-3 p-0" data-bind="visible: global.uvo.userType() === '0'">
                <label class="form-label">所属</label>
                <select class="form-select" aria-label="Default select example" data-bind="options: vendors, optionsText: 'name', value: vendorId, optionsValue: 'id', optionsCaption: ''">
                </select>
            </div>

            <div class="mb-3 p-0">
                <label class="form-label">申込番号</label>
                <input type="input" class="form-control" data-bind="textInput: accountId" maxlength="10">
            </div>

            <div class="mb-3 p-0">
                <label class="form-label">アカウント名</label>
                <input type="input" class="form-control" data-bind="textInput: accountName" maxlength="100">
            </div>

            <div class="mb-3 p-0">
                <label class="form-label">アカウント住所</label>
                <input type="input" class="form-control" data-bind="textInput: accountAddress" maxlength="200">
            </div>

            <div class="mb-3 p-0">
                <label class="form-label">同期結果</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="sc14_1-syncerror" data-bind="checked: syncError">
                    <label class="form-check-label" for="sc14_1-syncerror">失敗のみ</label>
                </div>
            </div>

            <div class="mb-3 p-0">
                <label class="form-label">使用領域</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="sc14_1-diskalert" data-bind="checked: diskAlert">
                    <label class="form-check-label" for="sc14_1-diskalert">90%以上のみ</label>
                </div>
            </div>

            <div class="mb-3 p-0">
                <label class="form-label">ソフトウェア</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="sc14_1-versionalert" data-bind="checked: versionAlert">
                    <label class="form-check-label" for="sc14_1-versionalert">旧バージョンのみ</label>
                </div>
            </div>

            <div class="mb-3 p-0">
                <button class="btn btn-primary bg-gradient" data-bind="click: search">検索</button>
                <button class="btn btn-light bg-gradient" data-bind="click: clear">クリア</button>
            </div>

        </div>

    </div>

</template>
