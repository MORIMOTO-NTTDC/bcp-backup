<template id="SC13_3-template">

    <!-- <h1 class="mb-4">ユーザ管理｜詳細</h1> -->

    <div class="mb-4 p-0" style="max-width: 35rem">
        <label class="form-label"><b>所属</b></label>
        <select class="form-select" aria-label="Default select example" data-bind="options: vendors, optionsText: 'name', value: vendorId, optionsValue: 'id', optionsCaption: '', enable: enableVendorField">
        </select>
        <p class="text-danger" data-bind="text: vendorId.errorMessage, visible: vendorId.errorMessage"></p>
    </div>


    <div class="mb-0 p-0" style="max-width: 23rem">
        <label for="sc13_2-user-id" class="form-label"><b>ユーザID</b></label>
        <input type="input" class="form-control font-monospace" id="sc13_2-user-id" maxlength="20" data-bind="value: userId, enable: enableUserIdField">
    </div>
    <div class="mb-4 p-0">
        <p class="text-danger" data-bind="text: userId.errorMessage, visible: userId.errorMessage"></p>
    </div>

    <div class="mb-0 p-0" style="max-width: 23rem">
        <label for="sc13_3-user-name" class="form-label"><b>ユーザ名</b></label>
        <div class="input-group">
            <input type="text" class="form-control" id="sc13_3-user-name" maxlength="100" data-bind="textInput: userName">
        </div>
    </div>
    <div class="mb-4 p-0">
        <p class="text-danger" data-bind="text: userName.errorMessage, visible: userName.errorMessage"></p>
    </div>


    <div class="mb-0 p-0" style="max-width: 30rem">
        <label for="sc13_3-mail" class="form-label"><b>メールアドレス</b></label>
        <div class="input-group">
            <input type="text" class="form-control font-monospace" id="sc13_3-mail" maxlength="100" data-bind="textInput: mail">
        </div>
    </div>
    <div class="mb-4 p-0">
        <p class="text-danger" data-bind="text: mail.errorMessage, visible: mail.errorMessage"></p>
    </div>

    <div class="mb-4 p-0">
        <label class="form-label"><b>権限</b></label>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="sc13_3-role-admin" data-bind="checked: admin, enable: enableAdminField">
            <label class="form-check-label" for="sc13_3-role-admin">管理者</label>
        </div>
    </div>

    <div class="mb-4 p-0" style="width: 16rem">
        <label for="sc13_3-start-date" class="form-label"><b>更新日時</b></label>
        <div class="font-monospace" data-bind="text: updateDate"></div>
    </div>

    <div class="mb-4 p-0">
        <button class="btn btn-primary bg-gradient" data-bind="click: update">更新</button>
        <button class="btn btn-danger bg-gradient" data-bind="click: remove">削除</button>
        <button class="btn btn-secondary bg-gradient" data-bind="click: cancel">戻る</button>
    </div>

</template>
